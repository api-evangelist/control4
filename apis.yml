name: Control4
description: 'Control4 is a smart home and building automation platform, now part of Snap One / ADI
  Global (Resideo), headquartered in Salt Lake City, Utah. It unifies control of lighting, audio/video,
  home theater, climate, security, shades, and voice across residential and commercial spaces through
  a single interface on smartphones, touchscreens, and on-wall keypads. Control4 is delivered through
  a network of certified integrators rather than direct-to-consumer sales, and interoperates with more
  than 25,000 third-party devices. For developers it offers the DriverWorks SDK (a Lua-based framework
  for building device drivers), the Control4 Developer Portal for OAuth application registration against
  the Control4 cloud, and public first-party libraries on GitHub.'
